name: iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          name="1.0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"

      # Same build as on your computer: app/ (the iPhone web app) and the single-file copy.
      - name: Build
        run: python3 build_app.py "${{ steps.ver.outputs.name }}"

      - name: Package downloads
        run: |
          mkdir -p dist
          cp "Stockyard Pay Ahead Demo (standalone).html" dist/pay-ahead-demo.html
          (cd app && zip -qr ../dist/pay-ahead-iphone-app.zip .)

      # Published at https://<owner>.github.io/<repo>/ (Settings -> Pages -> Branch: gh-pages, / root).
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app
          force_orphan: true
          commit_message: iPhone app ${{ steps.ver.outputs.name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pay Ahead ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Put it on your iPhone or iPad
            1. Open **https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/** in **Safari**.
            2. Tap **Share** (square with an arrow), then **Add to Home Screen**, then **Add**.
            3. Open **Pay Ahead** from your home screen. It runs full screen and works without a signal after the first open.

            Already installed? Just open it while online and it updates itself.

            ## Downloads
            - `pay-ahead-demo.html`: the whole demo in one file. AirDrop or email it and open it in any browser.
            - `pay-ahead-iphone-app.zip`: the web app folder, for hosting it somewhere else.
          files: |
            dist/pay-ahead-demo.html
            dist/pay-ahead-iphone-app.zip
